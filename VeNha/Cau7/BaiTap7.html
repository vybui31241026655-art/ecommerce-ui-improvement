<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7 - Website Layout</title>

    <style>
        /* RESET CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            padding: 50px 30px;
        }

        /* KHUNG BAO NGOÀI */
        #wrapper {
            width: 500px;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            border: 3px solid #222222;
            background-color: #ffffff;

            /* Đổ bóng cho khung wrapper giống hình đề bài */
            box-shadow: -15px 15px 20px rgba(0, 0, 0, 0.4);

            position: relative; /* Đặt vị trí làm mốc cho chữ wrapper */

            display: grid;
            grid-template-columns: 100px 1fr;
            grid-template-rows: 80px 250px 60px;
            gap: 10px;
        }

        /* TÊN KHU VỰC WRAPPER NẰM BÊN NGOÀI KHUNG */
        #wrapper::before {
            content: "wrapper";
            position: absolute;
            top: -28px;
            left: 0;
            font-size: 18px;
            color: #333333;
        }

        /* HEADER */
        header {
            grid-column: 1 / 3;
            border: 2px solid #222222;
            padding: 10px;
        }

        /* NAVIGATION */
        nav {
            grid-column: 1;
            border: 2px solid #222222;
            padding: 10px;
        }

        /* MAIN CONTENT */
        main {
            grid-column: 2;
            border: 2px solid #222222;
            padding: 10px;
        }

        /* FOOTER */
        footer {
            grid-column: 1 / 3;
            border: 2px solid #222222;
            padding: 10px;
        }

        /* TÊN CÁC KHU VỰC BÊN TRONG */
        header::before {
            content: "header";
        }

        nav::before {
            content: "nav";
        }

        main::before {
            content: "main";
        }

        footer::before {
            content: "footer";
        }
    </style>
</head>

<body>

    <div id="wrapper">
        <header></header>
        <nav></nav>
        <main></main>
        <footer></footer>
    </div>

</body>
</html>
